# Smithery deployment spec — https://smithery.ai/docs
# Opedd MCP: licensed, rights-cleared content for AI agents.
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      opeddBuyerToken:
        type: string
        description: Buyer API key (opedd_buyer_live_*): questions, articles, the feed and audit tools
      opeddAccessKey:
        type: string
        description: An order's access key (ent_*): the feed tools
      opeddBuyerJwt:
        type: string
        description: Buyer portal session token: orders, the account and audit tools
      opeddPubBearer:
        type: string
        description: Publisher API key (opedd_sk_*): publisher listing and push tools
  commandFunction: |-
    (config) => ({
      command: 'node',
      args: ['dist/index.js'],
      env: {
        ...(config.opeddBuyerToken ? { OPEDD_BUYER_TOKEN: config.opeddBuyerToken } : {}),
        ...(config.opeddAccessKey ? { OPEDD_ACCESS_KEY: config.opeddAccessKey } : {}),
        ...(config.opeddBuyerJwt ? { OPEDD_BUYER_JWT: config.opeddBuyerJwt } : {}),
        ...(config.opeddPubBearer ? { OPEDD_PUB_BEARER: config.opeddPubBearer } : {})
      }
    })
